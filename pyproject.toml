[project]
name = "labellens"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that load the real sentence-transformer model (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows inside a report template cannot be wrapped.
"src/cv/diagnose.py" = ["E501"]
# The importorskip guard must run before the CV imports below it.
"src/cv/test_*.py" = ["E402"]
"src/gen/test_*.py" = ["E402"]
